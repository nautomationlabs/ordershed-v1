name: frontend

on:
  pull_request:
    paths: ['apps/web/**', 'package*.json', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['apps/web/**', 'package*.json', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS IAM role, no long-lived keys

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_MODE: ${{ vars.VITE_API_MODE || 'mock' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ENV_LABEL: ${{ vars.VITE_ENV_LABEL || 'SANDBOX' }}
          VITE_APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: apps/web/dist, retention-days: 7 }

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: sandbox # add required reviewers on staging / prod environments
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Upload hashed assets (immutable)
        run: aws s3 sync dist/assets "s3://${{ vars.WEB_BUCKET }}/assets" --cache-control "public,max-age=31536000,immutable" --delete
      - name: Upload entry files (no-cache)
        run: aws s3 sync dist "s3://${{ vars.WEB_BUCKET }}" --exclude "assets/*" --cache-control "no-cache" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.WEB_DISTRIBUTION_ID }}" --paths "/index.html" "/"
